<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GitFolio</title>
<link rel="icon" type="image/svg+xml" id="ic">
<script>
// set before paint so the page never flashes the default palette
{
  const t = new URLSearchParams(location.search).get('theme')
  if (/^[a-z]{1,16}$/.test(t || '')) document.documentElement.dataset.theme = t
  // point the icon at the right avatar before anything is fetched, rather than loading the
  // deployment owner's and swapping it once the feed lands
  const u = location.pathname.split('/').filter(Boolean)[0]
  document.getElementById('ic').href = '/favicon.svg' + (u ? '?user=' + encodeURIComponent(u) : '')
}
</script>
<meta name="description" content="A portfolio that builds itself from a GitHub profile.">
<style>
:root{--bg:#0a0a0b;--fg:#ededef;--dim:#8a8a92;--line:#1e1e21;--accent:#ffc107;
  --glow1:255,193,7;--glow2:120,110,255;--star:255,255,255}
[data-theme="space"]{--bg:#05060f;--fg:#e8ecff;--dim:#7f88b0;--line:#171b33;--accent:#7aa2ff;
  --glow1:90,120,255;--glow2:170,90,255;--star:200,215,255}
[data-theme="cyberpunk"]{--bg:#0b0410;--fg:#f5e6ff;--dim:#a888c0;--line:#2a1038;--accent:#ff2fb9;
  --glow1:255,47,185;--glow2:0,229,255;--star:255,120,220}
[data-theme="rainbow"]{--bg:#0a0a0b;--fg:#f4f4f6;--dim:#9a9aa4;--line:#232327;--accent:#ff7a59;
  --glow1:255,90,120;--glow2:80,200,255;--star:255,235,180}
[data-theme="paper"]{--bg:#f7f5f0;--fg:#1a1a1c;--dim:#63636c;--line:#e0dcd4;--accent:#b4531f;
  --glow1:220,140,60;--glow2:120,150,220;--star:120,120,130}
[data-theme="mono"]{--bg:#0b0b0b;--fg:#f0f0f0;--dim:#8c8c8c;--line:#212121;--accent:#e6e6e6;
  --glow1:200,200,200;--glow2:140,140,140;--star:235,235,235}
[data-theme="forest"]{--bg:#07100c;--fg:#e6f2ea;--dim:#7fa38f;--line:#14251c;--accent:#4ade80;
  --glow1:74,222,128;--glow2:20,150,110;--star:190,235,210}
[data-theme="sunset"]{--bg:#140a10;--fg:#ffeee6;--dim:#b4899a;--line:#2c1520;--accent:#ff9d5c;
  --glow1:255,120,80;--glow2:255,60,140;--star:255,205,170}
[data-theme="nord"]{--bg:#2e3440;--fg:#eceff4;--dim:#a3adbe;--line:#3f4756;--accent:#88c0d0;
  --glow1:136,192,208;--glow2:129,161,193;--star:216,222,233}
[data-theme="slate"]{--bg:#0f1216;--fg:#e8ecf1;--dim:#8b98a8;--line:#1e242c;--accent:#7aa2c9;
  --glow1:122,162,201;--glow2:90,120,160;--star:200,215,230}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:16px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;padding:clamp(2rem,7vw,5rem) clamp(1.25rem,6vw,3rem)}
main{max-width:64rem;margin:0 auto;position:relative;z-index:1}
h1{font-size:clamp(2rem,6vw,3.25rem);line-height:1.05;letter-spacing:-.035em;margin:0;
  font-weight:650;overflow-wrap:anywhere}
h1 a{color:inherit;text-decoration:none;border-bottom:2px solid transparent}
h1 a:hover{border-bottom-color:var(--accent)}
h1 a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.sub{color:var(--dim);margin:.9rem 0 0;font-size:clamp(.95rem,2.2vw,1.05rem)}
.sub b{color:var(--fg);font-weight:550}
h2{font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);
  font-weight:600;margin:clamp(2rem,5vw,3rem) 0 .75rem}
section:first-of-type h2{margin-top:clamp(1.5rem,4vw,2rem)}
.wall,.grid{list-style:none;margin:0;padding:0;display:grid}
.wall{grid-template-columns:repeat(auto-fit,minmax(19rem,1fr));gap:1.25rem}
.grid{grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));gap:.75rem}
.wall li,.grid li{display:flex}
.wall .card,.grid .card{flex:1}
.card{display:block;text-decoration:none;color:inherit;border:1px solid var(--line);
  border-radius:10px;background:color-mix(in srgb,var(--fg) 4%,var(--bg));transition:border-color .2s,transform .2s;overflow:hidden}
.card:hover{border-color:color-mix(in srgb,var(--line) 60%,var(--fg));transform:translateY(-2px)}
.card b{display:block;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.9rem;
  font-weight:500;overflow-wrap:anywhere}
.card b::after{content:"\2197" / "";color:var(--dim);margin-left:.4rem;font-size:.8rem}
.card span{display:block;color:var(--dim);font-size:.88rem}
.big img{display:block;width:100%;height:auto;background:color-mix(in srgb,var(--fg) 7%,var(--bg));border-bottom:1px solid var(--line)}
.big b{padding:.85rem 1rem .1rem}
.big span{padding:0 1rem 1rem}
.sm{padding:.85rem .95rem}
/* a preview that failed leaves a text card in the wide grid: let it sit at its own height
   rather than stretch to match the cards that still have an image */
.wall .sm{align-self:start}
.sm span{margin-top:.3rem;font-size:.84rem;line-height:1.45}
.sm em{display:block;margin-top:.5rem;font-style:normal;font-size:.74rem;color:var(--dim);
  font-variant-numeric:tabular-nums}
#projects{min-height:min(70vh,700px)}
.skel{display:grid;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));gap:.75rem;margin-top:1.5rem}
.skel i{display:block;height:7.5rem;border:1px solid var(--line);border-radius:10px;
  background:color-mix(in srgb,var(--fg) 4%,var(--bg));
  animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
@media(prefers-reduced-motion:reduce){.skel i{animation:none}}
.stats{margin:.75rem 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:.35rem 1rem;
  color:var(--dim);font-size:.82rem;font-variant-numeric:tabular-nums}
.stats b{color:var(--fg);font-weight:600}
.stats a{color:var(--dim);text-decoration:none;border-bottom:1px solid var(--line)}
.stats a:hover{color:var(--accent);border-bottom-color:var(--accent)}
.feed{margin:2.5rem 0 0;color:var(--dim);font-size:.78rem}
.feed a{color:var(--dim);text-decoration:none;border-bottom:1px solid var(--line)}
.feed a:hover{color:var(--accent);border-bottom-color:var(--accent)}
footer{margin-top:clamp(3rem,8vw,5rem);padding-top:1.25rem;border-top:1px solid var(--line);
  color:var(--dim);font-size:.82rem;text-align:center}
footer p{margin:0 auto;max-width:52rem}
footer .links{margin-top:.45rem}
footer a{color:var(--dim);text-decoration:none}
footer a:hover{color:var(--accent)}

/* --- background: drifting glow + slow starfield --- */
.fx{position:fixed;inset:0;pointer-events:none;z-index:0}
.fx-glow{inset:-25%;
  background:radial-gradient(38% 32% at 28% 12%,rgba(var(--glow1),.11),transparent 70%),
             radial-gradient(34% 28% at 78% 4%,rgba(var(--glow2),.07),transparent 70%);
  animation:drift 80s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(4%,3%,0) scale(1.08)}}
@media(prefers-reduced-motion:reduce){.fx-glow{animation:none}}
</style>
</head>
<body>
<div class="fx fx-glow"></div>
<canvas class="fx fx-particles" id="fxp"></canvas>
<main>
  <h1><a id="nml" href="https://github.com/cpwillis" target="_blank" rel="noopener"><span id="nm">cpwillis</span></a> makes things.</h1>
  <p class="sub"><span id="role">Software engineer</span><span id="loc"></span><span id="stop">.</span> <b id="tag">Open one. They are running right now.</b></p>
<script>
// Runs during parse, before the header paints. The shipped markup names the deployment's own
// account, which is right for "/" but wrong the moment the path names somebody else.
{
  const u = location.pathname.split('/').filter(Boolean)[0]
  if (u) {
    let name = u
    try { name = decodeURIComponent(u) } catch {}
    document.getElementById('nm').textContent = name
    const nml = document.getElementById('nml')
    nml.href = 'https://github.com/' + encodeURIComponent(name)
    document.title = name + (/s$/i.test(name) ? "'" : "'s") + ' GitFolio'
    // no basis for calling a stranger a software engineer; stash it in case this deployment
    // turns out to be single-user and falls back to its own account
    const role = document.getElementById('role')
    role.dataset.own = role.textContent
    role.textContent = ''
    document.getElementById('stop').textContent = ''   // nothing before it yet
  }
}
</script>
  <ul id="stats" class="stats" aria-label="Profile totals"></ul>
  <div id="projects" role="status" aria-busy="true"><div class="skel" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
  <noscript><p class="feed">The project list needs JavaScript to load.</p></noscript>
  <footer>
    <p>Generated by <a id="gen" href="/">gitfolio</a> from public GitHub data. Previews open the live site,
      the rest open the source.</p>
    <!-- A fork should point these at its own policies, or drop them. -->
    <p class="links">
      <a href="https://github.com/cpwillis/gitfolio" target="_blank" rel="noopener">Source</a>
      · <a href="https://cpwillis.dev/terms">Terms</a>
      · <a href="https://cpwillis.dev/privacy">Privacy</a>
    </p>
  </footer>
</main>

<script>
{
  const c = document.getElementById('fxp'), x = c.getContext('2d')
  const still = matchMedia('(prefers-reduced-motion: reduce)')
  const star = getComputedStyle(document.documentElement).getPropertyValue('--star').trim() || '255,255,255'
  let w, h, dots
  const reset = () => {
    w = c.width = innerWidth; h = c.height = innerHeight
    dots = Array.from({length: 40}, () => ({
      x: Math.random() * w, y: Math.random() * h,
      vx: (Math.random() - .5) * .12, vy: (Math.random() - .5) * .12,
      r: Math.random() * 1.4 + .4,
    }))
  }
  const paint = () => {
    x.clearRect(0, 0, w, h)
    for (const d of dots) {
      x.fillStyle = `rgba(${star},.20)`
      x.beginPath(); x.arc(d.x, d.y, d.r, 0, 7); x.fill()
    }
  }
  const tick = () => {
    for (const d of dots) { d.x = (d.x + d.vx + w) % w; d.y = (d.y + d.vy + h) % h }
    paint()
    if (!still.matches) requestAnimationFrame(tick)
  }
  // resize only re-seeds; it must not start a second rAF loop
  addEventListener('resize', () => { reset(); if (still.matches) paint() })
  reset()
  still.matches ? paint() : tick()
}
</script>

<script>
// Take the accent from the profile picture when no theme was asked for. Only the accent and the
// two glow colours move: background, text and border stay put, so this cannot make anything
// unreadable however garish an avatar is. /favicon.svg already inlines the avatar as a data URI,
// so the canvas is never tainted and no extra image request happens.
async function accentFromAvatar(q) {
  if (document.documentElement.dataset.theme) return   // an accepted theme wins over the avatar
  const svg = await (await fetch('/favicon.svg' + q)).text()
  const m = svg.match(/data:image\/png;base64,([A-Za-z0-9+/=]+)/)
  if (!m) return
  const img = new Image()
  await new Promise((ok, no) => { img.onload = ok; img.onerror = no; img.src = 'data:image/png;base64,' + m[1] })

  const n = 24
  const c = document.createElement('canvas')
  c.width = c.height = n
  const cx = c.getContext('2d', { willReadFrequently: true })
  cx.drawImage(img, 0, 0, n, n)
  const px = cx.getImageData(0, 0, n, n).data

  // Circular mean of hue, weighted by saturation. Near-greys and the very dark and very light
  // ends carry no usable hue, so they are skipped rather than dragging the average.
  let sx = 0, sy = 0, sat = 0, seen = 0
  for (let i = 0; i < px.length; i += 4) {
    if (px[i + 3] < 128) continue
    const r = px[i] / 255, g = px[i + 1] / 255, b = px[i + 2] / 255
    const max = Math.max(r, g, b), min = Math.min(r, g, b), l = (max + min) / 2
    if (l < 0.15 || l > 0.9) continue
    const d = max - min
    if (d < 0.12) continue
    const sv = d / (1 - Math.abs(2 * l - 1))
    let hue
    if (max === r) hue = ((g - b) / d + 6) % 6
    else if (max === g) hue = (b - r) / d + 2
    else hue = (r - g) / d + 4
    hue *= 60
    const rad = (hue * Math.PI) / 180
    sx += Math.cos(rad) * sv
    sy += Math.sin(rad) * sv
    sat += sv
    seen++
  }
  if (seen < 8 || sat === 0) return   // a greyscale avatar has no accent to offer

  const hue = ((Math.atan2(sy, sx) * 180) / Math.PI + 360) % 360
  const s2 = Math.min(0.8, Math.max(0.45, sat / seen))

  const hsl = (hh, ss, ll) => {
    const k = (m2) => (m2 + hh / 30) % 12
    const a = ss * Math.min(ll, 1 - ll)
    const f = (m2) => Math.round(255 * (ll - a * Math.max(-1, Math.min(k(m2) - 3, Math.min(9 - k(m2), 1)))))
    return [f(0), f(8), f(4)]
  }
  const root = document.documentElement.style
  // fixed lightness keeps the accent legible on the dark palette whatever the source colour is
  root.setProperty('--accent', `rgb(${hsl(hue, s2, 0.66).join(',')})`)
  root.setProperty('--glow1', hsl(hue, s2, 0.55).join(','))
  // a small hue shift, desaturated: enough for depth, not enough to read as a second colour
  root.setProperty('--glow2', hsl((hue + 25) % 360, s2 * 0.6, 0.5).join(','))
}

// Stage 2: the shell is already painted; fetch the repo list and build cards from it.
// Stage 3: each big card's <img> then pulls its snapshot lazily.
;(async () => {
  const host = document.getElementById('projects')
  // a name already ending in s takes a bare apostrophe rather than a second s
  const possessive = n => n + (/s$/i.test(n) ? "'" : "'s")
  const el = (tag, cls, text) => {
    const n = document.createElement(tag)
    if (cls) n.className = cls
    if (text != null) n.textContent = text   // textContent, so repo text can never inject markup
    return n
  }
  const card = (r, isBig, i, who) => {
    const a = el('a', 'card ' + (isBig ? 'big' : 'sm'))
    a.href = isBig ? r.site : r.repoUrl
    a.target = '_blank'; a.rel = 'noopener'
    if (isBig) {
      const img = el('img')
      // /sc/<user>/<repo>: the account is in the path, so the URL identifies exactly one image.
      img.src = '/sc/' + encodeURIComponent(who) + '/' + encodeURIComponent(r.name)
      img.alt = ''; img.width = 1200; img.height = 750; img.decoding = 'async'
      // A preview can 404: the shot was evicted between the feed being built and this request, or
      // its capture is still running. Without this the reserved 1200x750 box just renders empty.
      // The repo is still live and the link still works, so degrade to a plain card, do not hide it.
      img.onerror = () => { img.remove(); a.className = 'card sm' }
      // the first preview is the LCP element and is above the fold, so it must not be lazy
      img.loading = i ? 'lazy' : 'eager'
      img.fetchPriority = i ? 'auto' : 'high'
      a.append(img)
    }
    a.append(el('b', null, r.name), el('span', null, r.desc || ''))
    if (!isBig) {
      const meta = [r.lang, r.stars ? r.stars + '\u2605' : null].filter(Boolean).join(' \u00b7 ')
      if (meta) a.append(el('em', null, meta))
    }
    return a
  }
  // /<username> picks whose portfolio this is; / falls back to the deployment's own account.
  // validation lives in the Worker, which is the only place it can be enforced; duplicating the
  // rule here just meant an invalid name silently fell back to the owner's portfolio
  // a malformed escape here would throw before the try below and leave the skeleton up forever
  let asked = ''
  try { asked = decodeURIComponent(location.pathname.split('/').filter(Boolean)[0] || '') } catch {}
  const q = asked ? '?user=' + encodeURIComponent(asked) : ''
  try {
    const res = await fetch('/api/repos' + q)
    if (!res.ok) throw new Error(res.status)   // 404 means no such account, anything else is us
    const { profile, stats, owner, big, small } = await res.json()
    // markup carries plausible defaults so the headline never flashes; this corrects drift,
    // and is what makes a fork work without editing the HTML at all
    if (profile?.name) {
      document.getElementById('nm').textContent = profile.name
      if (profile.login) document.getElementById('nml').href = 'https://github.com/' + profile.login
      document.title = possessive(profile.name) + ' GitFolio'
    }
    // On a single-user deployment the Worker ignores the requested username, so the path may name
    // somebody this site will never serve. Correct the URL and the header rather than pretending.
    if (asked && profile && profile.login.toLowerCase() !== asked.toLowerCase()) {
      history.replaceState({}, '', '/')
      asked = ''
    }
    const role = document.getElementById('role')
    // an organisation is not a software engineer, whoever's deployment this is
    const isOrg = profile?.type === 'Organization'
    role.textContent = owner && !isOrg ? (role.dataset.own ?? role.textContent) : ''
    const loc = document.getElementById('loc')
    if (profile?.location) {
      loc.textContent = (role.textContent ? ' in ' : '') + profile.location
    }
    // the full stop belongs to the sentence, so it only exists when there is a sentence
    document.getElementById('stop').textContent = role.textContent || loc.textContent ? '.' : ''
    if (profile?.login) {
      accentFromAvatar(q).catch(() => {})   // decorative: never let it hold up the cards
    }
    host.textContent = ''
    // a card is a link in a list of links, so say so rather than emitting a flat run of anchors
    const group = (cls, heading, rows, big, who) => {
      if (!rows.length) return
      const sec = el('section')
      const id = cls + '-h'
      const h = el('h2', null, heading); h.id = id
      sec.setAttribute('aria-labelledby', id)
      const ul = el('ul', cls)
      rows.forEach((r, i) => {
        const li = el('li'); li.append(card(r, big, big ? i : i + 1, who)); ul.append(li)
      })
      sec.append(h, ul); host.append(sec)
    }
    if (stats) {
      const box = document.getElementById('stats')
      const counts = [
        [stats.repos, 'repository', 'repositories'],
        [stats.stars, 'star', 'stars'],
        [stats.languages, 'language', 'languages'],
        [stats.followers, 'follower', 'followers'],
      ]
      for (const [n, one, many] of counts) {
        if (!n) continue
        const li = el('li')
        li.append(el('b', null, n.toLocaleString()), document.createTextNode(' ' + (n === 1 ? one : many)))
        box.append(li)
      }
      if (stats.since) box.append(el('li', null, 'on GitHub since ' + stats.since))
      if (profile?.login) {
        const li = el('li')
        const a = el('a', null, 'github.com/' + profile.login)
        a.href = 'https://github.com/' + profile.login
        a.target = '_blank'; a.rel = 'noopener'
        li.append(a); box.append(li)
      }
    }
    group('wall', 'Live projects', big, true, profile?.login || '')
    group('grid', big.length ? 'Other repositories' : 'Repositories', small, false, profile?.login || '')
    // the shipped tagline already covers the live case; only the other one needs saying
    if (!big.length) document.getElementById('tag').textContent = 'Everything public, straight from GitHub.'
    if (!big.length && !small.length) host.append(el('p', 'feed', 'No public repositories to show.'))
    host.setAttribute('aria-busy', 'false')
  } catch (e) {
    host.textContent = ''
    host.setAttribute('aria-busy', 'false')
    document.getElementById('tag').textContent = ''   // nothing loaded, so promise nothing
    document.getElementById('nml').removeAttribute('href')   // no profile, so nothing to link to
    const code = String(e.message)
    const why = code === '404' && asked
      // the Worker cannot know an account is missing without asking GitHub, so this is the first
      // point anything does. Tell crawlers, which is what turns a soft 404 into a real one.
      ? (document.head.insertAdjacentHTML('beforeend', '<meta name="robots" content="noindex">'),
         'No public GitHub profile found for "' + asked + '".')
      : code === '429'
        ? 'GitHub is rate limiting this site at the moment, so the project list could not be loaded. It should come back shortly.'
        : 'Could not reach the GitHub feed just now.'
    host.append(el('p', 'feed', why))
  }
})()
</script>
</body>
</html>
